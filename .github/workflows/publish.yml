name: Publish to PyPI

# Fires only on version tags (vX.Y.Z). Uses PyPI Trusted Publishing (OIDC):
# no API tokens are stored in the repository. One-time setup on PyPI is
# required before the first publish — see RELEASING.md.
#
# Actions in this workflow are pinned to commit SHAs (not movable tags)
# because it holds publish rights to the csemx PyPI project. Dependabot
# updates the pins; keep the trailing version comments in sync.

on:
  push:
    tags: ["v[0-9]*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match python/pyproject.toml version $VERSION" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
