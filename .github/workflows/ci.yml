name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The full-validation dependencies are deliberately unpinned (see
    # RELEASING.md); this weekly run catches breakage from new dependency or
    # Python releases while the repository is quiet.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  tests:
    name: tests (py${{ matrix.python-version }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the requires-python floor; 3.13 is current.
        python-version: ["3.9", "3.13"]
        # The suite must stay green without the optional dependencies (the
        # dependency-light validator path) and with them (full conformance).
        deps: [minimal, full]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install full validation dependencies
        if: matrix.deps == 'full'
        run: python -m pip install -r requirements-validation.txt
      - name: Run test suite
        run: python -m unittest discover -s python/tests
      - name: Validate example bundles
        run: tools/check_examples.sh
      - name: Validate example bundles (full conformance)
        if: matrix.deps == 'full'
        run: tools/check_examples.sh --full

  package:
    name: package (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify example.csemx.zip matches the unpacked bundle
        run: python tools/rebuild_example_zip.py --check
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build --verbose python
      - name: Qualify exact wheel and sdist in minimal and full installations
        run: |
          set -o pipefail
          for artifact in python/dist/*.whl python/dist/*.tar.gz; do
            python tools/check_distribution.py "$artifact" 2>&1 | tee "$artifact.qualification.log"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qualified-distributions-py${{ matrix.python-version }}
          path: python/dist/

  # Single stable context for branch-protection required checks and Dependabot
  # auto-merge. Gate on this job, never on individual matrix leg names.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [tests, package]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
