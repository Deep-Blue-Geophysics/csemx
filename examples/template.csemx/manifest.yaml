# csemx bundle manifest — FILL-IN TEMPLATE
#
# Lines starting with "#" are comments; they are ignored by software and you
# may delete them once you are done. Replace every value marked REPLACE.
# Keep the layout, spelling, and quoting exactly as shown: indentation is
# two spaces, and values shown in "double quotes" must keep their quotes.
# Full details for every key: csemx-specification.md §4.

format: # Identifies the file format. Do not change this block.
  name: csemx # Always exactly: csemx
  version: "0.1" # The csemx specification version this bundle follows. Always "0.1" (with quotes) for this beta release.

# The kind of data in the bundle. Version 1.0 defines only frequency-domain
# data, so this is always exactly: frequency. Do not change.
domain: frequency

survey:
  # Required. A human-readable name for the survey. Any non-blank text.
  name: "REPLACE Survey Name"
  # Required. A whole number, 1 or greater. Use 1 for the first delivery of a
  # survey. If you later re-deliver a corrected version, increase it by 1 —
  # the highest revision supersedes earlier ones.
  revision: 1
  # Required. When acquisition started and ended. Each value is EITHER a date
  # "YYYY-MM-DD" OR a UTC timestamp "YYYY-MM-DDTHH:MM:SSZ" — but both must use
  # the same style, and acquired_end must not be earlier than acquired_start
  # (they may be equal for a one-day survey). Keep the quotes; nothing else
  # (local times, slashes, month names) is accepted.
  acquired_start: "1900-01-01" # REPLACE with the real start
  acquired_end: "1900-01-01" # REPLACE with the real end
  # Required. The organization that produced this delivery. Any non-blank text.
  contractor: "REPLACE Contractor Name"
  # Required. Your internal job / contract / reference number for this survey.
  # Any non-blank text. Together, contractor + contractor_reference + name
  # identify the survey across deliveries.
  contractor_reference: "REPLACE Job Reference"

coordinate_system:
  # Required. REPLACE with the EPSG code of the map-grid coordinate system your
  # easting/northing values are in. It must be a PROJECTED system with meter
  # units — for example 32612 = WGS84 / UTM zone 12N (the placeholder shown).
  # Latitude/longitude codes such as 4326 are not allowed, and neither are
  # grids in feet. Look up codes at https://epsg.io.
  epsg_horizontal: 32612

elevation:
  # Required. The EPSG code saying what the "elev" heights in the vertex files
  # are measured against. Recommended: 4979 = height above the WGS84 ellipsoid
  # (what GPS/RTK equipment reports natively). Alternative: 3855 = EGM2008
  # geoid ("height above sea level"). Heights are meters, positive up.
  epsg_vertical: 4979

# OPTIONAL block — only needed if you add an "altitude" column (height above
# the local ground or seafloor) to tx_vertices or rx_vertices. If you do,
# remove the leading "# " from the two lines below and pick a reference:
#   ground   = land or airborne surveys (height above the ground surface)
#   seafloor = marine surveys (height above the seabed)
# It is an error to include this block when no altitude column exists.
# altitude:
#   reference: ground

sign:
  # Required. The sign convention used for the imaginary part of the data,
  # exactly one of the two spellings below (with quotes):
  #   "exp(+iwt)" — engineering convention; positive imaginary part leads
  #   "exp(-iwt)" — physics convention; positive imaginary part lags
  # Ask whoever processed the data which convention was used — a wrong choice
  # silently flips the sign of every imaginary part for the consumer.
  time_dependence: "exp(+iwt)"

# OPTIONAL block — leave it out (as here) when your real/imag values are the
# TOTAL field, which is the normal case and the default. Only include it, with
# content: secondary, when you deliver secondary-field data (total field minus
# the free-space primary, e.g. some airborne FDEM deliveries):
# field:
#   content: secondary
